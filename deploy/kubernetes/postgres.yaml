apiVersion: v1
kind: Service
metadata:
  name: coordinator-db
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: coordinator-db
  ports:
    - name: service
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coordinator-db
spec:
  serviceName: coordinator-db
  replicas: 1
  selector:
    matchLabels:
      app: coordinator-db
  template:
    metadata:
      labels:
        app: coordinator-db
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "matching"
            - name: POSTGRES_DB
              value: "coordinator"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: response-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "matching", "-d", "coordinator"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "matching", "-d", "coordinator"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "matching", "-d", "coordinator"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
