apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rabbitmq-data, namespace: emergency}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq, namespace: emergency}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      hostname: rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1.4-management
          ports: [{containerPort: 5672}, {containerPort: 15672}]
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: application-secrets, key: RABBITMQ_USER}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: application-secrets, key: RABBITMQ_PASSWORD}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
          readinessProbe:
            # Avoid starting an Erlang CLI VM on every probe on a small laptop.
            tcpSocket: {port: 5672}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rabbitmq-data}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: emergency}
spec:
  selector: {app: rabbitmq}
  ports: [{name: amqp, port: 5672}, {name: management, port: 15672}]
