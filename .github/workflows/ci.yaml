name: Build and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/compose/compose.yaml -f infra/compose/testing.yaml up -d --build
      - name: Wait for public API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8088/api/requests > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: node scripts/smoke.mjs
      - run: node scripts/integration.mjs
      - run: node scripts/load-test.mjs
      - run: node scripts/broker-recovery.mjs
      - run: node scripts/backup-restore.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: docs/evidence/
      - if: always()
        run: docker compose --env-file .env -f infra/compose/compose.yaml logs --no-color
      - if: always()
        run: docker compose --env-file .env -f infra/compose/compose.yaml down
