server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/resources { proxy_pass http://resource-service:8080/resources; proxy_set_header X-Correlation-ID $http_x_correlation_id; }
    location /api/ { proxy_pass http://request-service:8080/; proxy_set_header X-Correlation-ID $http_x_correlation_id; }
    location / { try_files $uri $uri/ /index.html; }
    location = /health { access_log off; return 200 'ok'; }
}
