spring.application.name=matching-service
server.port=${PORT:8083}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState
emergency.internal-token=${INTERNAL_TOKEN}
emergency.coordinator-url=${COORDINATOR_URL:http://localhost:8080}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [matching-service] [trace=%X{traceId}] %logger{30} - %msg%n
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=4
spring.rabbitmq.listener.simple.default-requeue-rejected=false
