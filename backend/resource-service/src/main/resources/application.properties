spring.application.name=resource-service
server.port=${PORT:8082}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState
emergency.internal-token=${INTERNAL_TOKEN}
emergency.coordinator-url=${COORDINATOR_URL:http://localhost:8080}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [resource-service] [trace=%X{traceId}] %logger{30} - %msg%n
