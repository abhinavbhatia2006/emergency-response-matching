spring.application.name=storage-coordinator
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState
emergency.internal-token=${INTERNAL_TOKEN}
emergency.coordinator-url=${COORDINATOR_URL:http://localhost:8080}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [storage-coordinator] [trace=%X{traceId}] %logger{30} - %msg%n
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
emergency.db-user=${DB_USER:emergency}
emergency.db-password=${DB_PASSWORD}
emergency.shard-urls=${SHARD_URLS:jdbc:postgresql://localhost:5433/emergency,jdbc:postgresql://localhost:5434/emergency,jdbc:postgresql://localhost:5435/emergency}
emergency.read-urls=${READ_URLS:}
emergency.node-urls=${NODE_URLS:}
